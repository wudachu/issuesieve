name: Feature request
description: Propose a maintainer workflow improvement
title: "[Feature]: "
labels: [feature, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What repeated maintenance task or review burden should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful workflow and its human approval boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing tools or simpler approaches did you evaluate?
